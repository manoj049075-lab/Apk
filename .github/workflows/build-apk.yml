name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-}"
          if [ -z "${JAVA_HOME:-}" ]; then
            echo "::error::JAVA_HOME is not set."
            exit 1
          fi
          VERSION_LINE="$(java -version 2>&1 | head -n 1)"
          MAJOR_VERSION="$(echo "$VERSION_LINE" | sed -E 's/.*version "([0-9]+).*/\1/')"
          if ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not detect active Java major version from: $VERSION_LINE"
            exit 1
          fi
          echo "Detected Java major version: $MAJOR_VERSION"
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Active Java major version ($MAJOR_VERSION) is lower than 17."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="./debug.keystore"
          if [ -f "$KEYSTORE_PATH" ]; then
            echo "Temporary debug keystore already exists at $KEYSTORE_PATH."
          else
            echo "Generating temporary debug keystore at $KEYSTORE_PATH..."
            "$JAVA_HOME/bin/keytool" -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" > /dev/null 2>&1
          fi
          if [ ! -f "$KEYSTORE_PATH" ] || [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Failed to create temporary debug keystore at $KEYSTORE_PATH."
            exit 1
          fi
          echo "Confirmed temporary debug keystore exists at $KEYSTORE_PATH."

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found at $EXPECTED_APK"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files inside app/build/outputs/apk:"
              find "app/build/outputs/apk" -type f -name "*.apk" -print
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Path $EXPECTED_APK is not a regular file."
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::APK file $EXPECTED_APK is empty."
            exit 1
          fi
          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "::error::Selected file does not have the .apk extension: $EXPECTED_APK"
              exit 1
              ;;
          esac
          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "::error::Selected APK path does not match app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi
          echo "Verified debug APK at $EXPECTED_APK ($(wc -c < "$EXPECTED_APK") bytes)."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        shell: bash
        run: |
          set -euo pipefail
           VERIFIED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$VERIFIED_APK" ] || [ ! -s "$VERIFIED_APK" ]; then
            echo "::error::Verified APK is missing or empty at $VERIFIED_APK"
            exit 1
          fi
          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO_NAME="$(echo "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="android-app"
          fi
          ASSET_FILENAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          TEMP_ASSET_DIR="${RUNNER_TEMP}/apk-release-asset-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$TEMP_ASSET_DIR"
          ASSET_PATH="${TEMP_ASSET_DIR}/${ASSET_FILENAME}"
          cp "$VERIFIED_APK" "$ASSET_PATH"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Failed to prepare release asset at $ASSET_PATH"
            exit 1
          fi
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_FILENAME" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $ASSET_FILENAME"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v gh > /dev/null 2>&1; then
            echo "::warning::GitHub CLI (gh) is not available on this runner."
            exit 1
          fi
          gh --version
          if [ -z "${ASSET_PATH:-}" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::warning::Prepared release asset does not exist or is empty: ${ASSET_PATH:-<empty>}"
            exit 1
          fi
          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "::warning::Prepared release asset is not a .apk file: $ASSET_PATH"
              exit 1
              ;;
          esac
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          RELEASE_NOTES="$(cat <<EOF
          ### Automated Debug APK Build
          - **Build Type**: Automatically generated debug APK
          - **Built By**: GitHub Actions
          - **Workflow Run Number**: \`${GITHUB_RUN_NUMBER}\`
          - **Workflow Run Attempt**: \`${GITHUB_RUN_ATTEMPT}\`
          - **Source Commit SHA**: \`${GITHUB_SHA}\`
          - **Purpose**: Intended for testing only (not a Google Play Store production release)
          - **Signing**: Signed only with a temporary debug keystore generated during the CI build
          EOF
          )"
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "$GITHUB_SHA" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        shell: bash
        run: |
          set -u
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          if [ "$PUBLISH_OUTCOME" = "success" ] && RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url --jq .url 2>/dev/null)" && [ -n "$RELEASE_URL" ]; then
            echo "Release Publishing Succeeded!"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Direct GitHub Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"
            {
              echo "## Debug APK Build & Release Summary"
              echo "- **Build & Artifact Status**: Succeeded"
              echo "- **GitHub Release Status**: Published"
              echo "- **Release Title**: ${RELEASE_TITLE}"
              echo "- **Release Tag**: \`${RELEASE_TAG}\`"
              echo "- **APK Asset Filename**: \`${ASSET_NAME}\`"
              echo "- **Direct Release Page URL**: ${RELEASE_URL}"
              echo ""
              echo "You can download \`${ASSET_NAME}\` directly from the **Assets** section on the GitHub Release page above."
              echo "The normal GitHub Actions artifact (\`app-debug-apk\`) is also available on this workflow run summary page as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed or was not completed. However, the debug APK build succeeded and the GitHub Actions artifact named 'app-debug-apk' remains available for download."
            {
              echo "## Debug APK Build & Release Summary"
              echo "- **Build & Artifact Status**: Succeeded"
              echo "- **GitHub Release Status**: Warning — Release publishing failed"
              echo "- **Backup Download**: The APK build succeeded and the GitHub Actions artifact named \`app-debug-apk\` remains available for download from this workflow run summary page."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
